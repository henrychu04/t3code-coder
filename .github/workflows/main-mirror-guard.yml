name: Main mirror guard

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-main-pull-request:
    if: github.event_name == 'pull_request_target'
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Close pull request targeting main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body \
            "main is a commit-for-commit mirror of pingdotgg/t3code. Retarget fork changes to coder-only."
          gh pr close "$PR_NUMBER"

  verify-main-mirror:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Compare main with upstream
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_REPOSITORY: ${{ github.repository }}
          UPSTREAM_REPOSITORY: pingdotgg/t3code
        run: |
          fork_sha="$(gh api "repos/$FORK_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          upstream_sha="$(gh api "repos/$UPSTREAM_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$fork_sha" != "$upstream_sha" ]; then
            echo "::error::main is not an exact mirror of upstream/main"
            exit 1
          fi
