name: CI

on:
  pull_request:
  push:
    branches: [main, coder-only]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coder
      - run: pnpm typecheck:gateway
      - run: pnpm typecheck:helper
      - run: pnpm typecheck:server
      - run: pnpm typecheck:web
      - run: pnpm build
