packages:
  - apps/*
  - packages/*

autoInstallPeers: false

# Coder: the Agent SDK is a type-only dependency. Never install its bundled Claude Code binaries.
ignoredOptionalDependencies:
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl"
  - "@anthropic-ai/claude-agent-sdk-linux-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64"
  - "@anthropic-ai/claude-agent-sdk-win32-x64"
  # Coder: pdfjs-dist's Node-only canvas; the browser viewer never loads it, so no native binary lands on the laptop.
  - "@napi-rs/canvas"

allowBuilds:
  bufferutil: false
  core-js: false
  esbuild: true
  msgpackr-extract: false
  msw: false
  node-pty: false
  sharp: false
  utf-8-validate: false

catalog:
  "@effect/atom-react": 4.0.5
  "@effect/openapi-generator": 4.0.5
  "@effect/platform-node": 4.0.5
  "@effect/platform-node-shared": 4.0.5
  "@effect/vitest": 4.0.5
  "@legendapp/list": 3.3.5
  "@pierre/diffs": 1.6.1
  "@tailwindcss/node": 4.3.3
  "@tailwindcss/oxide": 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@types/node": 24.12.4
  "@types/react": ~19.3.0
  "@types/react-dom": ~19.3.0
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 7.0.2
  effect: 4.0.5
  lightningcss: 1.33.0
  tailwindcss: 4.3.3
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  yaml: 2.9.0
  # Markdown pipeline: the server counts find matches with the same parser the
  # web renders with, so both must resolve to one version.
  mdast-util-directive: 3.1.0
  micromark-extension-directive: 4.0.0
  micromark-util-character: 2.1.1
  micromark-util-types: 2.0.2
  rehype-raw: 7.0.0
  rehype-sanitize: 6.0.0
  remark-breaks: 4.0.0
  remark-gfm: 4.0.1
  remark-parse: 11.0.0
  remark-rehype: 11.1.2
  unified: 11.0.5

minimumReleaseAgeExclude:
  - "@effect/atom-react@4.0.5"
  - "@effect/openapi-generator@4.0.5"
  - "@effect/platform-node-shared@4.0.5"
  - "@effect/platform-node@4.0.5"
  - "@effect/vitest@4.0.5"
  - "effect@4.0.5"
  - "@legendapp/list@3.3.5"
  - pele@1.8.0
  - "@pierre/diffs@1.6.1"
  - "@pierre/highlights@0.2.0"
  - "@pierre/theming@1.0.2"

overrides:
  # Pin every patched package, including transitive dependencies, so lockfile-free
  # release installs cannot drift past the patch. Update these with patchedDependencies.
  # Coder: only the patched packages the fork carries.
  mdast-util-math: 3.0.0
  micromark-extension-llm-math: 3.1.0
  micromark: 4.0.2
  mdast-util-to-hast: 13.2.1
  "@ff-labs/fff-node": 0.11.0
  "@legendapp/list": 3.3.5
  "@pierre/diffs": 1.6.1
  node-pty: 1.2.0-beta.15
  # Keep jsdom's optional peer consistent so Vite+ has one test-runner instance.
  "@exodus/bytes>@noble/hashes": "1.8.0"
  "@effect/atom-react": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/vitest>vitest": "-"
  "@effect/platform-node>undici": "-"
  "@pierre/diffs>@shikijs/transformers": 4.2.0
  # Resolve below remark-math so Vite, Metro and Node use the same tokenizer.
  "remark-math>micromark-extension-math": npm:micromark-extension-llm-math@3.1.0
  micromark-extension-gfm-table: 2.1.1
  # Keep one copy of these native-binary packages. lightningcss ships 11 platform binaries per
  # version, and the workspaces' tailwindcss ^4 ranges drift into two 4.3.x copies of the family.
  "@tailwindcss/node": "catalog:"
  "@tailwindcss/oxide": "catalog:"
  "@tailwindcss/vite": "catalog:"
  "@types/node": "catalog:"
  effect: "catalog:"
  lightningcss: "catalog:"
  tailwindcss: "catalog:"
  vite: "catalog:"
  vite-plus: "catalog:"
  yaml: "catalog:"

packageExtensions:
  "@effect/platform-node@*":
    peerDependenciesMeta:
      ioredis:
        optional: true
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"
    peerDependenciesMeta:
      vitest:
        optional: true
  vite-plus@*:
    dependencies:
      vite: "catalog:"

patchedDependencies:
  mdast-util-math@3.0.0: patches/mdast-util-math@3.0.0.patch
  micromark-extension-llm-math@3.1.0: patches/micromark-extension-llm-math@3.1.0.patch
  micromark-extension-gfm-table@2.1.1: patches/micromark-extension-gfm-table@2.1.1.patch
  micromark@4.0.2: patches/micromark@4.0.2.patch
  mdast-util-to-hast@13.2.1: patches/mdast-util-to-hast@13.2.1.patch
  node-pty@1.2.0-beta.15: patches/node-pty@1.2.0-beta.15.patch
  "@effect/vitest@4.0.5": patches/@effect__vitest@4.0.5.patch
  "@ff-labs/fff-node@0.11.0": patches/@ff-labs__fff-node@0.11.0.patch
  "@legendapp/list@3.3.5": patches/@legendapp__list@3.3.5.patch
  "@pierre/diffs@1.6.1": patches/@pierre%2Fdiffs@1.6.1.patch

peerDependencyRules:
  ignoreMissing:
    - ioredis
    - rolldown
    - yjs
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# pnpm 12 links agent skills that dependencies ship into .claude/skills once
# approved. We curate our own skills, so deny these to keep installs quiet.
permissions:
  "@tanstack/router-plugin":
    skills: false

# Coder: every host installs Linux x64 glibc native modules, which the helper bundle
# ships to the workspace. Upstream sets this only on Windows, in `.pnpmfile.cjs`.
supportedArchitectures:
  cpu: [current, x64]
  libc: [current, glibc]
  os: [current, linux]
