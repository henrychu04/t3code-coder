packages:
  - apps/*
  - packages/*

autoInstallPeers: false

# Coder: the Agent SDK is a type-only dependency. Never install its bundled Claude Code binaries.
ignoredOptionalDependencies:
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl"
  - "@anthropic-ai/claude-agent-sdk-linux-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64"
  - "@anthropic-ai/claude-agent-sdk-win32-x64"

allowBuilds:
  bufferutil: false
  core-js: false
  esbuild: true
  msgpackr-extract: false
  msw: false
  node-pty: false
  sharp: false
  utf-8-validate: false

catalog:
  "@effect/atom-react": 4.0.0-rc.115
  "@effect/platform-node": 4.0.0-rc.115
  "@effect/vitest": 4.0.0-rc.115
  "@legendapp/list": 3.3.5
  "@pierre/diffs": 1.3.0-beta.10
  "@types/node": 24.12.4
  typescript: 7.0.2
  effect: 4.0.0-rc.115
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  yaml: 2.9.0

minimumReleaseAgeExclude:
  - "@effect/atom-react@4.0.0-rc.115"
  - "@effect/platform-node@4.0.0-rc.115"
  - "@effect/vitest@4.0.0-rc.115"
  - "effect@4.0.0-rc.115"
  - "@legendapp/list@3.3.5"

overrides:
  "@exodus/bytes>@noble/hashes": "1.8.0"
  "@effect/atom-react": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/vitest>vitest": "-"
  "@effect/platform-node>undici": "-"
  "@pierre/diffs>@shikijs/transformers": 4.2.0
  "@types/node": "catalog:"
  effect: "catalog:"
  vite: "catalog:"
  yaml: "catalog:"

packageExtensions:
  "@effect/platform-node@*":
    peerDependenciesMeta:
      ioredis:
        optional: true
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"
    peerDependenciesMeta:
      vitest:
        optional: true
  vite-plus@*:
    dependencies:
      vite: "catalog:"

patchedDependencies:
  node-pty@1.2.0-beta.15: patches/node-pty@1.2.0-beta.15.patch
  "@effect/vitest@4.0.0-rc.115": patches/@effect__vitest@4.0.0-rc.115.patch
  "@ff-labs/fff-node@0.9.4": patches/@ff-labs__fff-node@0.9.4.patch
  "@legendapp/list@3.3.5": patches/@legendapp__list@3.3.5.patch
  "@pierre/diffs@1.3.0-beta.10": patches/@pierre%2Fdiffs@1.3.0-beta.10.patch
  effect@4.0.0-rc.115: patches/effect@4.0.0-rc.115.patch

peerDependencyRules:
  ignoreMissing:
    - ioredis
    - rolldown
    - yjs
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

supportedArchitectures:
  cpu: [current, x64]
  libc: [current, glibc]
  os: [current, linux]
